services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  backend:
    build:
      context: ./be
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: json
      LOG_LEVEL: info
      KEYCLOAK_ISSUER: http://localhost:8080/realms/shop
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/shop/protocol/openid-connect/certs
    ports:
      - "8000:8000"
    volumes:
      - product_images:/app/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./fe
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://backend:8000/api
      APP_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET}
      KEYCLOAK_ISSUER: http://localhost:8080/realms/shop
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/shop
      KEYCLOAK_CLIENT_ID: shop-web
      KEYCLOAK_CLIENT_SECRET: shop-web-secret
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  product_images:
