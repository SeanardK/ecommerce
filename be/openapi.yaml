openapi: 3.0.3
info:
  title: Shop API
  version: "1.0.0"
  description: >
    Catalog, cart, checkout, orders, and admin API. Authentication is a
    Keycloak-issued bearer JWT; the `customer` and `admin` realm roles gate
    the routes marked below. All `/api/*` routes are rate limited (60/min,
    keyed by user id or IP); `POST /api/checkout` is limited further to
    6/min.
servers:
  - url: http://localhost:8000/api
tags:
  - name: Catalog
  - name: Cart
  - name: Checkout
  - name: Orders
  - name: Admin
  - name: Webhooks
  - name: Auth

paths:
  /health:
    get:
      tags: [Catalog]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /categories:
    get:
      tags: [Catalog]
      summary: List categories
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }

  /products:
    get:
      tags: [Catalog]
      summary: List active products
      security: []
      parameters:
        - name: category
          in: query
          schema: { type: string }
          description: Filter by category slug.
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive match on product name.
        - name: per_page
          in: query
          schema: { type: integer, default: 12, maximum: 50 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedProducts" }

  /products/{slug}:
    get:
      tags: [Catalog]
      summary: Product detail
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { description: Not found }

  /cart:
    get:
      tags: [Cart]
      summary: View the authenticated user's cart
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartSummary" }
        "401": { description: Unauthenticated }

  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: integer }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartSummary" }
        "422": { description: "Validation error, e.g. quantity exceeds stock" }

  /cart/items/{productId}:
    put:
      tags: [Cart]
      summary: Update an item's quantity
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartSummary" }
    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartSummary" }

  /checkout:
    post:
      tags: [Checkout]
      summary: Place an order from the current cart
      description: Rate limited to 6 requests/minute per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Address" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "422": { description: "Empty cart, insufficient stock, or payment declined" }
        "429": { description: Rate limited }

  /orders:
    get:
      tags: [Orders]
      summary: List the authenticated user's orders
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedOrders" }

  /orders/{order}:
    get:
      tags: [Orders]
      summary: Order detail (owner only)
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: "Not found, or not owned by the caller" }

  /orders/{order}/cancel:
    post:
      tags: [Orders]
      summary: Cancel one of the authenticated user's own orders
      description: >
        Allowed only from `pending` or `paid`. Restocks the order's line
        items on success.
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: "Not found, or not owned by the caller" }
        "422": { description: "Order is not in a cancellable state" }

  /admin/products:
    post:
      tags: [Admin]
      summary: Create a product
      security: [{ bearerAuth: [admin] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { description: Missing admin role }

  /admin/products/{product}:
    put:
      tags: [Admin]
      summary: Update a product
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      tags: [Admin]
      summary: Delete a product
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/categories:
    post:
      tags: [Admin]
      summary: Create a category
      security: [{ bearerAuth: [admin] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }

  /admin/categories/{category}:
    delete:
      tags: [Admin]
      summary: Delete a category
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/orders:
    get:
      tags: [Admin]
      summary: List all orders across users
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedOrders" }

  /admin/orders/{order}/status:
    patch:
      tags: [Admin]
      summary: Transition an order's status
      description: >
        Valid transitions: pending -> paid|cancelled, paid ->
        fulfilled|cancelled, fulfilled -> completed. Cancelling restocks
        the order's line items.
      security: [{ bearerAuth: [admin] }]
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, paid, fulfilled, completed, cancelled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "422": { description: Invalid transition }

  /webhooks/payment:
    post:
      tags: [Webhooks]
      summary: Payment gateway confirmation callback
      description: >
        Server-to-server. Verified via an `X-Signature` header holding
        HMAC-SHA256(raw body, PAYMENT_WEBHOOK_SECRET). Idempotent: replays
        against an already-resolved order or an unknown reference both
        return 200. Rate limited to 30/min.
      security: []
      parameters:
        - name: X-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, event]
              properties:
                reference: { type: string, description: Order.payment_reference }
                event:
                  type: string
                  enum: [payment.succeeded, payment.failed]
      responses:
        "200": { description: "Processed, already processed, or ignored" }
        "401": { description: Missing or invalid signature }
        "422": { description: Validation error }

  /me:
    get:
      tags: [Auth]
      summary: The authenticated user's identity and roles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  email: { type: string }
                  roles: { type: array, items: { type: string } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued access token.
  schemas:
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }

    Product:
      type: object
      properties:
        id: { type: integer }
        category_id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        image_url: { type: string, nullable: true }
        price_cents: { type: integer }
        stock: { type: integer }
        active: { type: boolean }
        category: { $ref: "#/components/schemas/Category" }

    ProductInput:
      type: object
      required: [category_id, name, description, price_cents, stock, active]
      properties:
        category_id: { type: integer }
        name: { type: string }
        description: { type: string }
        image_url: { type: string, nullable: true }
        price_cents: { type: integer }
        stock: { type: integer }
        active: { type: boolean }

    PaginatedProducts:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Product" }

    CartLine:
      type: object
      properties:
        product_id: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        unit_price_cents: { type: integer }
        line_total_cents: { type: integer }

    CartSummary:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
        subtotal_cents: { type: integer }

    Address:
      type: object
      required: [line1, city, region, postal_code, country]
      properties:
        line1: { type: string }
        line2: { type: string, nullable: true }
        city: { type: string }
        region: { type: string }
        postal_code: { type: string }
        country: { type: string }

    OrderItem:
      type: object
      properties:
        product_id: { type: integer }
        product_name: { type: string }
        quantity: { type: integer }
        unit_price_cents: { type: integer }

    Order:
      type: object
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [pending, paid, fulfilled, completed, cancelled]
        subtotal_cents: { type: integer }
        tax_cents: { type: integer }
        total_cents: { type: integer }
        payment_reference: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        address: { $ref: "#/components/schemas/Address" }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    PaginatedOrders:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Order" }

security:
  - bearerAuth: []
